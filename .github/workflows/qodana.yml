name: Qodana

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  qodana:
    name: Static analysis for Android and Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Qodana Community for Android
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --linter qodana-jvm-android
          upload-result: true
          post-pr-comment: false
