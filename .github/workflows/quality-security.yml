name: Quality and security

on:
  push:
    branches: [main, master, principal]
  pull_request:
    branches: [main, master, principal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-quality:
    name: Android tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests, lint, and build
        run: ./gradlew test lintDebug assembleDebug

  backend-quality:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies and audit tool
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  codeql:
    name: CodeQL source analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6
      - if: matrix.language == 'java-kotlin'
        name: Build Android code for analysis
        run: ./gradlew assembleDebug
      - uses: github/codeql-action/analyze@v4
