name: Quality and security

on:
  push:
    branches: [main, master, principal]
  pull_request:
    branches: [main, master, principal]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-quality:
    name: Android tests, lint, and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests, lint, and build
        run: ./gradlew test lintDebug assembleDebug

  backend-quality:
    name: Backend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies and audit tool
        run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  codeql:
    name: CodeQL source analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, python
          build-mode: manual
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Android code for analysis
        run: ./gradlew assembleDebug
      - uses: github/codeql-action/analyze@v4

  gradle-dependency-graph:
    name: Submit Android dependency graph
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/dependency-submission@v6
