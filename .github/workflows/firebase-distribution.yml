name: Firebase test distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_ORGANIZATION_ID: ${{ secrets.FIREBASE_ORGANIZATION_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate required project configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in FIREBASE_PROJECT_ID FIREBASE_ANDROID_APP_ID FIREBASE_ORGANIZATION_ID FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_TESTERS GOOGLE_SERVICES_JSON_BASE64 AI_BACKEND_URL; do
            if [[ -z "${!name}" ]]; then echo "Missing repository secret: $name" >&2; exit 1; fi
          done
          [[ "$AI_BACKEND_URL" == https://* ]] || { echo "AI backend URL must use HTTPS." >&2; exit 1; }
      - name: Configure Firebase for this run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf 'firebaseOrganizationId=%s\naiBackendUrl=%s\n' "$FIREBASE_ORGANIZATION_ID" "$AI_BACKEND_URL" > local.properties
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Build and verify Firebase-enabled debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Deploy Firestore security rules
        run: npx --yes firebase-tools@14.26.0 deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Distribute signed test APK
        run: npx --yes firebase-tools@14.26.0 appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app "$FIREBASE_ANDROID_APP_ID" --testers "$FIREBASE_TESTERS" --release-notes "CotizadorLeguía test build from $GITHUB_SHA" --project "$FIREBASE_PROJECT_ID"
      - name: Remove temporary Firebase credentials
        if: always()
        shell: bash
        run: |
          rm -f app/google-services.json local.properties "$RUNNER_TEMP/firebase-service-account.json"
