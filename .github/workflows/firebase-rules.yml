name: Firebase Firestore rules

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase-tests/**'
      - '.github/workflows/firebase-rules.yml'
  push:
    branches: [codex/firebase-integration]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'firebase-tests/**'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.12'
          cache: npm
          cache-dependency-path: firebase-tests/package-lock.json
      - name: Install rules test dependencies
        run: npm ci --prefix firebase-tests
      - name: Test Firestore rules in the emulator
        run: npx --yes firebase-tools@14.26.0 emulators:exec --project demo-cotizador-leguia --only firestore "npm --prefix firebase-tests test"
